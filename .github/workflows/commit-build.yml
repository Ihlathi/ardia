name: Commit build

on:
  push:
  workflow_dispatch:

concurrency:
  group: commit-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA: ${{ github.workspace }}/apps/browser/build-commit-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: engine
        run: |
          tree=$(git rev-parse HEAD:engine)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt
          key: engine-${{ steps.engine.outputs.tree }}
      - name: Engine
        run: |
          framework=$(packages/ardiacore/scripts/fetch-engine.sh)
          {
            echo "ARDIACORE_FRAMEWORK=$framework"
            echo "ARDIACORE_FRAMEWORK_ENGINE=${{ steps.engine.outputs.tree }}"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/browser/macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('apps/browser/macos/Podfile', 'apps/browser/macos/Podfile.lock', 'pnpm-lock.yaml', 'patches/**') }}
          restore-keys: pods-
      - name: Pods
        working-directory: apps/browser/macos
        run: pod install
      - name: Build
        run: scripts/agent/build-app --as commit-ci --config Release --force
      - name: Package
        run: |
          app="$DERIVED_DATA/Build/Products/Release/Ardia.app"
          [ -d "$app" ] || { echo "::error::build did not produce $app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/commit-build"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/commit-build/Ardia-${GITHUB_SHA:0:12}.zip"
          printf 'commit=%s\nengine=%s\n' "$GITHUB_SHA" "${{ steps.engine.outputs.tree }}" \
            > "$RUNNER_TEMP/commit-build/build-info.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-commit-${{ github.sha }}
          path: ${{ runner.temp }}/commit-build
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-commit-${{ github.sha }}-logs
          path: |
            apps/browser/build-commit-ci/build-app.log
            apps/browser/build-commit-ci/**/*.log
          if-no-files-found: ignore
          retention-days: 14
